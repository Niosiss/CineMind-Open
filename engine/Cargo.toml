[package]
name = "cinemind-engine"
version = "0.1.0"
edition = "2021"
description = "Offline recommendation engine for the browser"
publish = false

[lib]
name = "cinemind_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
